<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="672" viewBox="0 0 1280 672" role="img" aria-label="娛樂城 Dcard 討論整理"><rect x="0" y="0" width="1280" height="672" rx="0" fill="#eff4f8"/><rect x="0" y="0" width="1280" height="270" rx="0" fill="#132c42"/><text x="64" y="38" font-family="Noto Sans CJK TC, sans-serif" font-size="22" dominant-baseline="text-before-edge" fill="#9ed7e7">FUN1399 / 編輯查核筆記</text><text x="1060" y="40" font-family="Noto Sans CJK TC, sans-serif" font-size="20" dominant-baseline="text-before-edge" fill="#e2edf5">2026 更新版</text><text x="60" y="102" font-family="Noto Sans CJK TC, sans-serif" font-size="64" dominant-baseline="text-before-edge" fill="#ffffff">娛樂城 Dcard 討論整理</text><text x="64" y="201" font-family="Noto Sans CJK TC, sans-serif" font-size="28" dominant-baseline="text-before-edge" fill="#d8e7ef">閱讀心得之前，先核對這三件事。</text><rect x="64" y="304" width="368" height="256" rx="20" fill="#ffffff"/><rect x="88" y="330" width="6" height="50" rx="3" fill="#247c9c"/><text x="112" y="328" font-family="Noto Sans CJK TC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#132c42">原文</text><text x="88" y="398" font-family="Noto Sans CJK TC, sans-serif" font-size="23" dominant-baseline="text-before-edge" fill="#216b87">找得到來源嗎？</text><text x="88" y="449" font-family="Noto Sans CJK TC, sans-serif" font-size="21" dominant-baseline="text-before-edge" fill="#475569">原始網址與發文日期</text><text x="88" y="488" font-family="Noto Sans CJK TC, sans-serif" font-size="21" dominant-baseline="text-before-edge" fill="#475569">是否有更新與完整前後文</text><rect x="454" y="304" width="368" height="256" rx="20" fill="#ffffff"/><rect x="478" y="330" width="6" height="50" rx="3" fill="#247c9c"/><text x="502" y="328" font-family="Noto Sans CJK TC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#132c42">證據</text><text x="478" y="398" font-family="Noto Sans CJK TC, sans-serif" font-size="23" dominant-baseline="text-before-edge" fill="#216b87">紀錄支持到哪裡？</text><text x="478" y="449" font-family="Noto Sans CJK TC, sans-serif" font-size="21" dominant-baseline="text-before-edge" fill="#475569">區分申請、付款與入帳</text><text x="478" y="488" font-family="Noto Sans CJK TC, sans-serif" font-size="21" dominant-baseline="text-before-edge" fill="#475569">單筆經驗不是安全保證</text><rect x="844" y="304" width="368" height="256" rx="20" fill="#ffffff"/><rect x="868" y="330" width="6" height="50" rx="3" fill="#247c9c"/><text x="892" y="328" font-family="Noto Sans CJK TC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#132c42">關係</text><text x="868" y="398" font-family="Noto Sans CJK TC, sans-serif" font-size="23" dominant-baseline="text-before-edge" fill="#216b87">推薦關係說清楚？</text><text x="868" y="449" font-family="Noto Sans CJK TC, sans-serif" font-size="21" dominant-baseline="text-before-edge" fill="#475569">留意邀請碼與合作揭露</text><text x="868" y="488" font-family="Noto Sans CJK TC, sans-serif" font-size="21" dominant-baseline="text-before-edge" fill="#475569">不因導流就直接判定真假</text><text x="64" y="611" font-family="Noto Sans CJK TC, sans-serif" font-size="22" dominant-baseline="text-before-edge" fill="#475569">編輯查核示意圖｜不是論壇截圖或玩家實測紀錄</text></svg>